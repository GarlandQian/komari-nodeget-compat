name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check project
        run: bun run check

      - name: Ensure R2 theme cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run setup:r2

      - name: Deploy Worker
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: bun
          command: deploy --var "ACG_BACKGROUND_ENABLED:${{ vars.ACG_BACKGROUND_ENABLED || 'false' }}" --var "ALLOWED_GITHUB_REPOSITORIES:${{ vars.ALLOWED_GITHUB_REPOSITORIES || 'none' }}" --var "NODEGET_DASHBOARD_URL:${{ vars.NODEGET_DASHBOARD_URL || 'https://dash.nodeget.com' }}" --var "RELEASE_CHECK_TTL_SECONDS:${{ vars.RELEASE_CHECK_TTL_SECONDS || '300' }}"

      - name: Prewarm and verify remote themes
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          ALLOWED_GITHUB_REPOSITORIES: ${{ vars.ALLOWED_GITHUB_REPOSITORIES || 'none' }}
          ACG_BACKGROUND_ENABLED: ${{ vars.ACG_BACKGROUND_ENABLED || 'false' }}
        run: bun run prewarm
